<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#140B1E" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF006E" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7B2FBE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF006E" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box with Rounded Corners -->
  <rect x="2" y="2" width="1196" height="276" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="140" r="100" fill="#00F5FF" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="140" r="100" fill="#FF006E" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="140" r="130" fill="#7B2FBE" opacity="0.1" filter="url(#glow)" />

  <!-- Decorative Wave Lines -->
  <path d="M 50,220 Q 300,160 600,210 T 1150,180" fill="none" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.3" />
  <path d="M 50,235 Q 350,180 650,225 T 1150,200" fill="none" stroke="url(#textGrad)" stroke-width="1" opacity="0.2" />

  <!-- Title Text -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Main Name -->
    <text x="600" y="125" font-size="62" font-weight="800" fill="url(#textGrad)" letter-spacing="2">
      AMARDEEP
    </text>

    <!-- Subtitle / Roles -->
    <text x="600" y="175" font-size="22" font-weight="500" fill="#E2E8F0" letter-spacing="1.5">
      Full Stack &amp; Mobile Developer &nbsp;•&nbsp; AI &amp; Software Engineer
    </text>

    <!-- Tagline / Highlight Pill -->
    <g transform="translate(420, 205)">
      <rect x="0" y="0" width="360" height="34" rx="17" fill="#1E293B" stroke="#00F5FF" stroke-width="1" opacity="0.8" />
      <text x="180" y="23" font-size="14" font-weight="600" fill="#00F5FF" letter-spacing="1">
        ⚡ FLUTTER &amp; DART &nbsp;|&nbsp; REACT &amp; DJANGO
      </text>
    </g>
  </g>
</svg>
